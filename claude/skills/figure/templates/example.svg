<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160"
     font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">
  <!-- Conventions: 8 px grid, 1.5 px strokes, one accent (#1f6feb), labels inside shapes, 16 px outer margin. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- stage 1: input -->
  <g id="input">
    <rect x="16" y="48" width="128" height="64" rx="6" fill="#f3f5f8" stroke="#1f2328" stroke-width="1.5"/>
    <text x="80" y="76" text-anchor="middle">Video</text>
    <text x="80" y="96" text-anchor="middle" font-size="12" fill="#5b6470">RGB frames</text>
  </g>

  <!-- stage 2: the method (accent = the contribution) -->
  <g id="method">
    <rect x="216" y="48" width="128" height="64" rx="6" fill="#e8f0fe" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="280" y="76" text-anchor="middle" font-weight="bold">Pose model</text>
    <text x="280" y="96" text-anchor="middle" font-size="12" fill="#5b6470">per frame</text>
  </g>

  <!-- stage 3: output -->
  <g id="output">
    <rect x="416" y="48" width="128" height="64" rx="6" fill="#f3f5f8" stroke="#1f2328" stroke-width="1.5"/>
    <text x="480" y="76" text-anchor="middle">Forces</text>
    <text x="480" y="96" text-anchor="middle" font-size="12" fill="#5b6470">per contact</text>
  </g>

  <!-- arrows sit on the box borders -->
  <g id="arrows" stroke="#1f2328" stroke-width="1.5" fill="none">
    <line x1="144" y1="80" x2="214" y2="80" marker-end="url(#arrow)"/>
    <line x1="344" y1="80" x2="414" y2="80" stroke="#1f6feb" marker-end="url(#arrow-accent)"/>
  </g>

  <!-- annotation: one size smaller, muted -->
  <text x="379" y="64" text-anchor="middle" font-size="12" fill="#1f6feb">ours</text>
</svg>

# ~/.tmux.conf when the tmux part is on. Oh my tmux reads ~/.tmux.conf.local and expands the
# $tmux_theme_* names while parsing it, so the theme file has to be loaded first.
TMUX_CONF="$HOME/.local/share/oh-my-tmux/.tmux.conf"
TMUX_CONF_LOCAL="$HOME/.tmux.conf.local"
source-file "$HOME/.config/dotfiles/tmux-theme.conf"
source-file "$HOME/.local/share/oh-my-tmux/.tmux.conf"

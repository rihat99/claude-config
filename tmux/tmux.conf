# ============================================================
#  ~/.tmux.conf
# ============================================================

# --- General quality-of-life ---------------------------------
set -g focus-events on           # let editors (vim/nvim) detect focus
set -g mouse on                  # click panes/windows, scroll, drag-resize
set -g base-index 1              # windows start at 1 (matches Alt-1)
setw -g pane-base-index 1        # panes start at 1 too
set -g renumber-windows on       # keep window numbers gapless on close
set -sg escape-time 10           # snappier ESC / Alt keys
set -g history-limit 50000       # bigger scrollback buffer
set -g default-terminal "tmux-256color"

# --- Prefix: Alt-a (Ctrl-b kept as backup) -------------------
set -g prefix M-a
set -g prefix2 C-b               # fallback so you're never locked out
bind M-a send-prefix             # press Alt-a twice to send a literal prefix

# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Toggle mouse on/off — turn OFF to drag-select text natively, then Cmd-C
bind m set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# --- Fast window switching (no prefix) -----------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-p previous-window      # cycle to previous window (Alt-arrows don't
bind -n M-n next-window          # survive VS Code; plain Meta+letter does)

# Repeatable prefix-based cycling (tap n/p repeatedly after prefix)
bind -r n next-window
bind -r p previous-window

# New window right AFTER the current one ('c' still appends at the end).
# Opens in the current pane's directory.
bind C new-window -a -c "#{pane_current_path}"

# ============================================================
#  Status bar (Classic default — green bar, black text)
# ============================================================
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=green,fg=black"
set -g window-status-separator ""

# Left: session name
set -g status-left "#[bg=black,fg=green,bold] #S #[bg=green,fg=black] "
set -g status-left-length 20

# Windows: current window inverted (black on green)
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[bg=black,fg=green,bold] #I:#W "

# Right: hostname + date/time (the classic default layout)
set -g status-right " #H  %Y-%m-%d %H:%M "
set -g status-right-length 40

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=green"

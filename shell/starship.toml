# Prompt for zsh (Mac) and bash (Linux): shell/zshrc.zsh and shell/bashrc.bash point
# STARSHIP_CONFIG here. One line, and only characters the Monaco font has, so no Nerd Font is
# needed in iTerm, VS Code or a phone SSH client. Colours are the terminal's own 16 (on the Mac
# the iTerm profile iterm/dotfiles.json sets them), so the prompt follows light and dark mode.
"$schema" = 'https://starship.rs/config-schema.json'

# One listed order instead of starship's default "every module": host (only over SSH), folder,
# Python environment, how long the last command took. No git.
format = '$hostname$directory$conda$python$cmd_duration$jobs$character'
add_newline = false
command_timeout = 2000

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'bold purple'

[directory]
truncation_length = 3
truncate_to_repo = false
style = 'bold blue'

[conda]
format = '[$environment]($style) '
style = 'green'

[python]
# shown only for an active virtualenv; conda environments are the conda module's job
format = '([$virtualenv]($style) )'
style = 'green'
detect_extensions = []
detect_files = []
detect_folders = []

[cmd_duration]
min_time = 5000
format = '[$duration]($style) '
style = 'yellow'

[character]
success_symbol = '[›](bold green)'
error_symbol = '[›](bold red)'
